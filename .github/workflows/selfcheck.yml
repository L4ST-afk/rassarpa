name: selfcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: selfcheck（五项）
        run: python3 tools/selfcheck.py

      - name: 行为回归（白盒）
        run: python3 tests/test_spacing.py

      - name: 浏览器脚本回归（jsdom）
        run: |
          npm install --silent --no-audit --no-fund
          node tests/test_spacing_js.mjs

      - name: 数字-量词混用检查（逐份文档）
        run: |
          git ls-files -z '*.md' | while IFS= read -r -d '' f; do
            python3 tools/check_spacing_consistency.py "$f" || exit 1
          done

      - name: 语法
        run: |
          python3 -m py_compile tools/*.py tests/*.py
          node --check tools/cjk_spacing.js
          node --check tools/measure.mjs

name: selfcheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时取消旧跑，别让过时矩阵占满 runner。
concurrency:
  group: selfcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: selfcheck（五项）
        run: python3 tools/selfcheck.py

      - name: selfcheck 自身的变异自检（A1 变异件必须判红）
        run: python3 tools/selfcheck.py --self-test

      - name: 读数对账（README 的数字 vs results）
        run: python3 tools/check_readings.py

      - name: 跨引擎读数对账（results/*-pw.json）
        run: python3 tools/check_engines.py

      - name: 行为回归（白盒）
        run: python3 tests/test_spacing.py

      - name: 浏览器脚本回归（jsdom）
        run: |
          npm ci --silent --no-audit --no-fund
          node tests/test_spacing_js.mjs

      - name: 数字-量词混用检查（逐份文档）
        run: |
          git ls-files -z '*.md' | while IFS= read -r -d '' f; do
            python3 tools/check_spacing_consistency.py "$f" || exit 1
          done

      - name: 语法
        run: |
          python3 -m py_compile tools/*.py tests/*.py
          node --check tools/cjk_spacing.js
          node --check tools/measure.mjs
          node --check tools/measure_pw.mjs
          node --check tools/measure_safari.mjs

  # 跨引擎：在 CI 里真起 Firefox 与 WebKit 各量一遍，读数当 artifact 留档。
  # CI 是 Linux，没有苹方／宋体／黑体，C7 那三条在这里不判；WebKit 构建也不等于 Safari 本体。
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: 装依赖
        run: npm ci --silent --no-audit --no-fund

      - name: 装浏览器（Firefox 与 WebKit）
        run: npx playwright install --with-deps firefox webkit

      - name: 量
        run: node tools/measure_pw.mjs --out results/ci

      - name: 对账并打印
        run: |
          python3 tools/check_engines.py results/ci
          for f in results/ci/*.md; do
            sed -n '1,14p' "$f"
            echo
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-readings-linux
          path: results/ci
